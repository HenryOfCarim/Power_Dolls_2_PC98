; Boot the Power Dolls 2 HDI and run PALDUMP.COM, then halt the emulator with
; the debugger's own EXIT command so the run is unattended.
;
; Work on a COPY of the image (_hdi_test\pd2s_test.hdi), never the original.
;
; Start with:
;   dosbox-x.exe -conf tools\run_palette_probe.conf -working-dir <workspace>

[dosbox]
machine = pc98
memsize = 16
captures = _hdi_test\capture
; expose the HDI's FAT filesystem as a host directory instead of raw sectors -
; this is the supported way to push files onto the image from outside
convertdrivefat = true
mcp_server = 2999

[render]
aspect = false

[cpu]
core = dynamic
cputype = auto
cycles = max

[sdl]
fullscreen = false
output = surface
windowresolution = original
showmenu = true
autolock = false

[autoexec]
IMGMOUNT C "_hdi_test\pd2s_test.hdi"
BOOT C:
