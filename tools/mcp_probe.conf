; Minimal DOSBox-X config for testing the external debugger control server
; ("MCP") and the undocumented palette commands.
;
; No HDI, no game: this only proves the transport + `PC98 DACPAL` work, which
; is the part that cannot be verified statically.
;
; Start with:
;   dosbox-x.exe -conf tools\mcp_probe.conf -c "config -set mcp_server=<port>"

[dosbox]
machine = pc98
memsize = 16
captures = _hdi_test\capture
; external debugger control server: DOSBox-X dials 127.0.0.1:<port> itself.
; The listener must already be running, otherwise the connection simply fails.
mcp_server = 2999

[render]
aspect = false

[cpu]
core = dynamic
cputype = auto
cycles = max

[sdl]
fullscreen = false
output = surface
windowresolution = original
showmenu = true
autolock = false

[autoexec]
echo MCP probe: DOSBox-X booted, debugger control server should connect now.
