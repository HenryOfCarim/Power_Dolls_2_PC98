; Decisive write-back test.
;
; Does a file written by the *guest* end up in the HDI on the HOST once DOSBox-X
; quits cleanly? The guest here is the HDI's own DOS (COMMAND.COM), mounted as a
; logical FAT drive - no boot sector involved, so this isolates the flushing
; behaviour from the PC-98 boot path.
;
; Start with:
;   dosbox-x.exe -conf tools\writeback_probe.conf -working-dir <workspace>

[dosbox]
machine = pc98
memsize = 16
captures = _hdi_test\capture

[render]
aspect = false

[cpu]
core = dynamic
cputype = auto
cycles = max

[sdl]
fullscreen = false
output = surface
windowresolution = original
showmenu = true
autolock = false

[autoexec]
IMGMOUNT C "_hdi_test\pd2s_wb.hdi" -t hdd -size 512,17,4,320
C:
ECHO HOST-WRITEBACK-TEST > WBTEST.TXT
EXIT
