; Second-stage test: boot the PD2 HDI copy whose AUTOEXEC.BAT now runs the
; in-guest palette dumper before START.COM.
;
; Start with:
;   dosbox-x.exe -conf tools\run_inject_probe.conf -working-dir <workspace>

[dosbox]
machine = pc98
memsize = 16
captures = _hdi_test\capture
mcp_server = 2999

[render]
aspect = false

[cpu]
core = dynamic
cputype = auto
cycles = max

[sdl]
fullscreen = false
output = surface
windowresolution = original
showmenu = true
autolock = false

[autoexec]
IMGMOUNT C "_hdi_test\pd2s_inj.hdi"
BOOT C:
